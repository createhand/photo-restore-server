services:
  photo-restore-api:
    container_name: photo-restore-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MAX_GPU_WORKERS: "1"
      MODEL_DIR: /app/models
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      MAX_UPLOAD_BYTES: "26214400"
      REAL_ESRGAN_TILE: "512"
      REAL_ESRGAN_TILE_PAD: "10"
      SWINIR_TILE: "256"
      SWINIR_TILE_OVERLAP: "32"
      MAX_INPUT_LONG_SIDE: "3600"
      AUTO_2X_MAX_INPUT_PIXELS: "3000000"
      MAX_OUTPUT_PIXELS: "40000000"
      DEFAULT_CODEFORMER_WEIGHT: "0.85"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./api/models:/app/models
      - ./api/input:/app/input
      - ./api/output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
